name: Deploy to GitHub Pages 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build for Pages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📦 Create deployment package
        run: |
          mkdir -p _site
          
          # Check if files exist before copying
          if [ -f index.html ]; then
            cp index.html _site/
          else
            echo "⚠️ index.html not found, creating basic one..."
            cat > _site/index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Calculator App</title>
          </head>
          <body>
              <script src="app.js"></script>
          </body>
          </html>
          INDEXEOF
          fi
          
          # Check for app.js in src folder
          if [ -f src/app.js ]; then
            cp src/app.js _site/
          elif [ -f app.js ]; then
            cp app.js _site/
          else
            echo "❌ app.js not found!"
            exit 1
          fi
          
          # Create a nice landing page
          cat > _site/info.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Calculator App - Deployment Info</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      padding: 20px;
                  }
                  .container {
                      background: white;
                      border-radius: 20px;
                      padding: 40px;
                      max-width: 600px;
                      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                  }
                  h1 { color: #667eea; margin-bottom: 20px; }
                  .info { margin: 15px 0; padding: 15px; background: #f7fafc; border-radius: 10px; }
                  .label { font-weight: bold; color: #4a5568; }
                  .value { color: #2d3748; word-break: break-all; }
                  .button {
                      display: inline-block;
                      margin-top: 20px;
                      padding: 15px 30px;
                      background: #48bb78;
                      color: white;
                      text-decoration: none;
                      border-radius: 10px;
                      font-weight: bold;
                      transition: all 0.3s;
                  }
                  .button:hover {
                      background: #38a169;
                      transform: translateY(-2px);
                  }
                  .badge {
                      display: inline-block;
                      padding: 5px 10px;
                      background: #48bb78;
                      color: white;
                      border-radius: 5px;
                      font-size: 0.8em;
                      margin-left: 10px;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🧮 Calculator App</h1>
                  <div class="info">
                      <span class="label">📦 Version:</span>
                      <span class="value">1.0.${GITHUB_RUN_NUMBER}</span>
                      <span class="badge">Latest</span>
                  </div>
                  <div class="info">
                      <span class="label">🌿 Branch:</span>
                      <span class="value">${GITHUB_REF_NAME}</span>
                  </div>
                  <div class="info">
                      <span class="label">📝 Commit:</span>
                      <span class="value">${GITHUB_SHA:0:7}</span>
                  </div>
                  <div class="info">
                      <span class="label">👤 Deployed by:</span>
                      <span class="value">${GITHUB_ACTOR}</span>
                  </div>
                  <div class="info">
                      <span class="label">🕐 Deployed at:</span>
                      <span class="value">$(date '+%Y-%m-%d %H:%M:%S UTC')</span>
                  </div>
                  <a href="index.html" class="button">🚀 Open Calculator App</a>
              </div>
          </body>
          </html>
          EOF
          
          # Replace GitHub variables with actual values
          sed -i "s/\${GITHUB_RUN_NUMBER}/${{ github.run_number }}/g" _site/info.html
          sed -i "s/\${GITHUB_REF_NAME}/${{ github.ref_name }}/g" _site/info.html
          sed -i "s/\${GITHUB_SHA:0:7}/${GITHUB_SHA:0:7}/g" _site/info.html
          sed -i "s/\${GITHUB_ACTOR}/${{ github.actor }}/g" _site/info.html
          
          echo "✅ Deployment package created!"
          echo "📂 Contents of _site/:"
          ls -la _site/
      
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: 🚀 Deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: ✅ Deployment Complete
        run: |
          echo "## 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Your Calculator App is Live!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Main App:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Info Page:** ${{ steps.deployment.outputs.page_url }}info.html" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "✨ **Version:** 1.0.${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "👤 **Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY