name: Complete CI/CD Pipeline 🚀

# ======================== EVENTS ========================
on: 
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

# ======================== ENVIRONMENT VARIABLES ========================
env:
  NODE_VERSION: '22'
  PROJECT_PATH: 'my-project'

# ======================== JOBS ========================
jobs:
  # ==================== JOB 1: TEST ====================
  test:
    name: 🧪 Test Application
    runs-on: ubuntu-latest
    
    outputs:
      test-result: ${{ steps.run-tests.outcome }}
      coverage: ${{ steps.coverage-report.outputs.coverage }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.PROJECT_PATH }}/package-lock.json
      
      - name: 📊 Display Workflow Info
        run: |
          echo "🔷 Repository: ${{ github.repository }}"
          echo "🔷 Branch: ${{ github.ref_name }}"
          echo "🔷 Commit SHA: ${{ github.sha }}"
          echo "🔷 Actor: ${{ github.actor }}"
          echo "🔷 Event: ${{ github.event_name }}"
          echo "🔷 Run Number: ${{ github.run_number }}"
      
      - name: 📦 Install Dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "⚠️ package-lock.json not found, running npm install..."
            npm install
          else
            echo "✅ Using npm ci with package-lock.json"
            npm ci
          fi
      
      - name: 🧪 Run Tests
        id: run-tests
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm test -- --coverage --coverageReporters=json-summary
      
      - name: 📈 Coverage Report
        id: coverage-report
        if: always()
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total.lines.pct")
            echo "coverage=$COVERAGE%" >> $GITHUB_OUTPUT
            echo "✅ Test Coverage: $COVERAGE%"
          else
            echo "coverage=N/A" >> $GITHUB_OUTPUT
          fi
      
      - name: 📤 Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: ${{ env.PROJECT_PATH }}/coverage/
          retention-days: 30

  # ==================== JOB 2: BUILD ====================
  build:
    name: 🏗️ Build Application
    needs: test
    runs-on: ubuntu-latest
    
    if: ${{ needs.test.outputs.test-result == 'success' }}
    
    outputs:
      build-version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🏷️ Generate Version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"
      
      - name: 📦 Package Application
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          echo "📦 Packaging application files..."
          mkdir -p ../build
          cp *.js ../build/ 2>/dev/null || true
          cp *.html ../build/ 2>/dev/null || true
          cp package.json ../build/ 2>/dev/null || true
          echo "✅ Packaging complete!"
      
      - name: 📤 Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: calculator-app-v${{ steps.version.outputs.version }}
          path: build/
          retention-days: 90
      
      - name: ✅ Build Success
        run: |
          echo "🎉 Build completed successfully!"
          echo "Version: ${{ steps.version.outputs.version }}"

  # ==================== JOB 3: DEPLOY ====================
  deploy:
    name: 🚀 Deploy Application
    needs: [test, build]
    runs-on: ubuntu-latest
    
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📊 Deployment Information
        run: |
          echo "🚀 Deploying to production"
          echo "📦 Version: ${{ needs.build.outputs.build-version }}"
          echo "🌐 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "🎯 Test Coverage: ${{ needs.test.outputs.coverage }}"
      
      - name: 📝 Create Deployment Summary
        run: |
          echo "# 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.build.outputs.build-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Coverage**: ${{ needs.test.outputs.coverage }}" >> $GITHUB_STEP_SUMMARY
      
      - name: ✅ Deployment Complete
        run: echo "✅ Deployment completed successfully!"